[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
    "aarch64-apple-darwin",
    "aarch64-pc-windows-msvc",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-musl",
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Homebrew tap repository
tap = "sassman/homebrew-tap"
# Publish jobs to run
publish-jobs = ["homebrew"]
# Don't publish prereleases to Homebrew
publish-prereleases = false
# We customize release.yml (GitHub App auth for Homebrew, downstream docker/deb jobs).
# Don't overwrite our customizations on subsequent `dist init` runs.
allow-dirty = ["ci"]
